# Guided lesson for track 4, Ocean currents: the Gulf Stream, one idea at a time (direction, then
# speed, then change). Every direction and speed is measured from NASA's film; see
# pipeline/tracks/ocean_lesson.py. Writes public/data/07_ocean_lesson.json and
# public/media/07_ocean_lesson/gulf-stream.webp.
id: 07_ocean_lesson
title: "The Gulf Stream, step by step"
builder: ocean_lesson

film: media/07_ocean_currents/tour.mp4     # under public/: the ocean tour's web copy of NASA's film
tour: data/07_ocean_currents.json          # the tour's clock (startDate, daysPerStep, framesPerStep)
window:                                    # seconds of the film where NASA's camera holds still
  from: 234
  to: 262
  parts: 12                                # 12 stretches of about 8 days each
radius: 5                                  # each place averages an 11 x 11 px patch (about 50 km)
land_red_over_blue: 10                     # land is tan or green (red above blue); the sea is blue

source:
  svs_id: 5425
  url: https://svs.gsfc.nasa.gov/5425/
  svs_title: "Perpetual Ocean 2: Western Boundary Currents"
  credit: "NASA's Scientific Visualization Studio"

# Known coast points, as [name, lat, lon, x, y] in a 640 x 360 frame of the film. An affine fit of
# these finds every place in the picture.
georef_max_px: 15
georef:
  - [Cape Henlopen, 38.78, -75.09, 264, 29]
  - [Cape Charles, 37.12, -75.97, 252, 70]
  - [Cape Hatteras, 35.22, -75.53, 246, 104]
  - [Jacksonville coast, 30.40, -81.40, 140, 195]
  - [Cape Canaveral, 28.46, -80.53, 148, 250]
  - [Miami, 25.77, -80.13, 154, 307]
  - [Cape Sable, 25.12, -81.08, 131, 327]
  - [Tampa Bay mouth, 27.60, -82.75, 107, 266]
  - [Apalachee Bay, 30.00, -84.20, 78, 212]

alt: >
  NASA's picture of the south-east United States and the western North Atlantic, spring 2023. Fine
  white flow lines cover the blue sea. A thick bright band runs north between Florida and the
  Bahamas, follows the coast, then turns east into loops and swirls.

caveat: >
  Directions and speeds are measured from how NASA's white flow lines move in the film, while NASA's
  camera holds still. Speeds are compared with the fastest water in this view; they are not metres
  per second. NASA's film shows a computer model of the ocean (ECCO2), not single measurements.

# The example sounds. Each one is explained before it is played, and can be played again.
cues:
  wave: {label: "A wave", text: "A wave: the tone bobs up and down but stays in the middle. The water rises and falls in one place."}
  current: {label: "A current", text: "A current: the tone travels steadily from your left ear to your right. The water is carried along."}
  north: {label: "North", text: "North: the tone rises."}
  east: {label: "East", text: "East: the tone moves from your left ear to your right."}
  south: {label: "South", text: "South: the tone falls."}
  west: {label: "West", text: "West: the tone moves from your right ear to your left."}
  slow: {label: "Slow", text: "Slow: a few ticks a second."}
  medium: {label: "Medium", text: "Medium."}
  fast: {label: "Fast", text: "Fast: quick ticks, like the middle of the Gulf Stream."}
  together: {label: "North, fast", text: "Both together: the tone rises for north, while quick ticks play for fast water."}

steps:
  - kind: text
    title: "What is an ocean current?"
    text: >
      An ocean current is water that keeps flowing the same way, like a river in the sea. A wave is
      different. When a wave passes, the water mostly rises and falls in about the same place: a
      floating ball bobs up and down and stays put. In a current, the ball would be carried away.
      Currents can carry warm water thousands of kilometres. Two sounds show the difference.
    previews: [wave, current]

  - kind: text
    title: "Our example: the Gulf Stream"
    text: >
      Our example is the Gulf Stream, one of the fastest currents on Earth. It flows between Florida
      and the Bahamas, runs north along the east coast of the United States, then turns out across
      the Atlantic, carrying warm water from the tropics. Everything you hear in this lesson is
      measured from NASA's film Perpetual Ocean 2, from {from} to {to}, while NASA's camera holds
      still over the Gulf Stream. We measured which way NASA's white flow lines move, and how fast.

  - kind: cue
    title: "The direction sound"
    text: >
      First, direction: which way the water goes. Imagine you are floating in the sea, facing north.
      The direction sound is a short tone that travels the way the water goes. Water flowing north:
      the tone rises. Flowing south: it falls. Flowing east: it moves from your left ear to your
      right. Flowing west: from your right ear to your left. Headphones help with left and right.
    previews: [north, east, south, west]

  - kind: point
    title: "Direction, place 1 of 4: off Miami"
    place: "off Miami, Florida"
    at: [26.2, -79.7]
    expect: 0
    text: >
      Off Miami, the Gulf Stream squeezes between Florida and the Bahamas. Here the water flows
      {compass}.

  - kind: point
    title: "Direction, place 2 of 4: off Georgia"
    place: "off Georgia"
    at: [31.4, -78.9]
    expect: 45
    text: >
      Further north, off Georgia, the coast bends away to the east, and the current bends with it.
      Here the water flows {compass}.

  - kind: point
    title: "Direction, place 3 of 4: off the Carolinas"
    place: "off the Carolinas"
    at: [32.8, -75.1]
    expect: 80
    text: >
      Off the Carolinas, the current leaves the coast and heads out to sea. Here the water flows
      {compass}.

  - kind: point
    title: "Direction, place 4 of 4: far out in the Atlantic"
    place: "far out in the Atlantic, south of the stream"
    at: [26.4, -67.9]
    expect: 250
    within: 45
    text: >
      Now far out in the Atlantic, south of the stream and east of the Bahamas. Here the water
      drifts {compass}, almost the opposite way. The Gulf Stream is one side of a giant loop of
      currents that turns slowly around the North Atlantic.

  - kind: cue
    title: "The speed sound"
    text: >
      Next, speed: how fast the water moves. The speed sound is a run of soft ticks, like drops
      passing you. The faster the water, the faster the ticks. The ticks stay in the middle and
      keep one pitch, so you hear speed alone. Speeds are compared with the fastest water in this
      part of NASA's film.
    previews: [slow, medium, fast]

  - kind: line
    title: "Speed across the current"
    place: "a line from the coast at Cape Canaveral, Florida, out to sea"
    line:
      coast: [28.4, -80.6]
      from: [28.4, -80.4]
      to: [28.4, -77.4]
      samples: 7
    text: >
      Now cross the current off Cape Canaveral, Florida, from the coast straight out to sea. You
      will hear 7 places, each named by how far it is from the coast. Listen for the ticks to speed
      up in the middle of the stream, then slow down again.
    after: >
      The fastest water was about {peak_km} kilometres from the coast. The Gulf Stream is a narrow,
      fast river inside slower water.

  - kind: cue
    title: "Changes over time"
    text: >
      Last, change. Currents shift from week to week. Now we stay in one place and listen to it
      every 8 days, 12 times, from {from} to {to}. Each time you hear both sounds you have learned
      at once: the tone for direction, and ticks for speed. The date is said first.
    previews: [together]

  - kind: series
    title: "Change, place 1 of 2: a steady place"
    place: "the middle of the Gulf Stream, off Cape Canaveral"
    at: [28.4, -79.7]
    expect: 0
    text: >
      First, the middle of the Gulf Stream off Cape Canaveral. Listen: does the direction change?
    after:
      steady: >
        All {count} times, the water flowed {compasses}, though its speed changed, from {speed_lo}
        to {speed_hi} percent of the fastest. Near Florida, the Gulf Stream holds its course.
      changing: >
        Here the water flowed {compasses}. Near Florida, the Gulf Stream mostly holds its course.

  - kind: series
    title: "Change, place 2 of 2: a restless place"
    place: "out at sea, east of the Carolinas"
    at: [32.9, -72.9]
    text: >
      Now a place out at sea, east of the Carolinas, where the current snakes and swirls. The same
      12 times, 8 days apart.
    after:
      steady: >
        Here too the water flowed {compasses} every time.
      changing: >
        Here the direction kept turning: {compasses}. A bend in the current, called a meander,
        drifted past, and swirls called eddies broke off it. Currents are steady in some places and
        restless in others.

  - kind: text
    title: "What you learned, and the full tour"
    text: >
      You learned that a current is water that keeps moving one way, unlike a wave. The Gulf Stream
      flows north along Florida, then turns east across the Atlantic, while slow water far to the
      south drifts back west. It is fastest in a narrow middle, steady near Florida and restless
      further out. The full tour, in the player, is NASA's world map of every ocean's surface
      currents, March 2007 to March 2008. A scan line moves from west to east across it,
      and only what is under the line plays. Its sounds differ from this lesson's: a harp note rings
      where the line crosses a strong current, and a low hum follows all the moving water under the
      line. There, high and in your left ear means north, low and in your right ear means south. The
      Gulf Stream comes about a third of the way across.
