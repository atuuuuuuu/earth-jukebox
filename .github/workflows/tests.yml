name: Browser tests

# The real page in Chromium: every key, speech text, sound level, axe on every track, and every
# layout from 320 to 1440 px. Separate from the deploy, so a slow runner never blocks a launch;
# a red cross here still means something to look at.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:responsive
